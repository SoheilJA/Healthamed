<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04AB6C" />
    <meta
      name="description"
      content="هلثامد - پلتفرم سلامت دیجیتال؛ مشاوره آنلاین پزشکان، نسخه الکترونیک با کد پیگیری و کارت اضطراری آفلاین"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>هلثامد | سلامت دیجیتال</title>
    <style>
      /* First-paint splash, removed by the app on mount */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #04ab6c;
        z-index: 99999;
        transition: opacity 0.3s ease;
        font-family: Vazirmatn, Tahoma, sans-serif;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash .mark {
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      }
      #splash .mark::after {
        content: '';
        width: 30px;
        height: 10px;
        background: #04ab6c;
        border-radius: 3px;
        box-shadow: 0 10px 0 0 #04ab6c, 0 -10px 0 0 #04ab6c;
      }
      #splash .bar {
        width: 120px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.35);
        overflow: hidden;
      }
      #splash .bar::after {
        content: '';
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: #fff;
        animation: splash-slide 1s ease-in-out infinite;
      }
      @keyframes splash-slide {
        0% {
          transform: translateX(120%);
        }
        100% {
          transform: translateX(-320%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="mark"></div>
      <div class="bar"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
